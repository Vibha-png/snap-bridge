<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Snap Bridge | Shared Booth</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 10% 10%,
            #dce8ff,
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            #efdfff,
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            #dff8ed,
            transparent 30%
        ),

        #f8faff;

    color: #273568;

}


.container {

    width: 100%;

    max-width: 850px;

    padding: 40px;

    background:
        rgba(255,255,255,.90);

    border:
        2px solid
        rgba(255,255,255,.8);

    border-radius: 32px;

    box-shadow:
        0 25px 70px
        rgba(50,60,120,.16);

    text-align: center;

}


.logo {

    font-size: 32px;

    font-weight: 800;

    margin-bottom: 8px;

}


.logo span {

    color: #7569d9;

}


.subtitle {

    color: #737d9d;

    margin-bottom: 35px;

}


.options {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 25px;

}


.card {

    padding: 30px 24px;

    background: white;

    border:
        2px solid #e1e5f3;

    border-radius: 25px;

    box-shadow:
        0 12px 30px
        rgba(60,70,130,.08);

}


.card h2 {

    margin-top: 0;

}


.card p {

    color: #707995;

    line-height: 1.6;

}


button {

    border: 0;

    padding: 14px 24px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #5969d0,
            #8068d5
        );

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;

}


button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(90,90,190,.2);

}


input {

    width: 100%;

    padding: 15px;

    margin: 12px 0;

    border:
        2px solid #dce1ef;

    border-radius: 15px;

    outline: none;

    font-size: 17px;

    text-align: center;

    text-transform: uppercase;

    letter-spacing: 2px;

}


input:focus {

    border-color: #716bd3;

}


.hidden {

    display: none;

}


.room-code {

    margin: 20px 0;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #f0efff,
            #edf5ff
        );

    border-radius: 20px;

    color: #5c64c8;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 6px;

}


.players {

    margin: 20px 0;

    padding: 16px;

    border-radius: 15px;

    background: #f3f5ff;

    font-size: 18px;

    font-weight: 800;

}


.status {

    margin: 20px 0;

    padding: 18px;

    border-radius: 18px;

    background: #f8f9ff;

    color: #69738f;

    line-height: 1.5;

}


.share-buttons {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

}


.secondary {

    background: #8992aa;

}


.success {

    color: #328d67;

    font-weight: bold;

}


@media(max-width:650px) {

    .container {

        padding: 25px 18px;

    }

    .options {

        grid-template-columns: 1fr;

    }

    .room-code {

        font-size: 30px;

        letter-spacing: 3px;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">

        📸 Snap <span>Bridge</span> ✨

    </div>


    <p class="subtitle">

        Create a shared photo booth with your friends

    </p>


    <!-- HOME -->

    <div id="home-screen">


        <div class="options">


            <!-- CREATE -->

            <div class="card">

                <h2>
                    ✨ Create Room
                </h2>

                <p>

                    Create a room and get a unique
                    Snap Bridge code.

                </p>

                <button
                    onclick="createRoom()">

                    Create Room →

                </button>

            </div>


            <!-- JOIN -->

            <div class="card">

                <h2>
                    💜 Join Room
                </h2>

                <p>

                    Enter the code given by
                    your friend.

                </p>


                <input
                    id="room-input"
                    maxlength="9"
                    placeholder="SB-ABC123"
                    autocomplete="off"
                >


                <button
                    onclick="joinRoom()">

                    Join Room →

                </button>

            </div>


        </div>

    </div>


    <!-- ROOM -->

    <div
        id="room-screen"
        class="hidden"
    >

        <h2>
            🎉 Snap Bridge Room
        </h2>


        <p>
            Share this code with your friend:
        </p>


        <div
            class="room-code"
            id="room-display">

        </div>


        <div
            class="players"
            id="players-display">

            👥 Players: 1 / 3

        </div>


        <div
            class="status"
            id="status-message">

            ✨ Room created!
            Waiting for your friend...

        </div>


        <div class="share-buttons">


            <button
                onclick="copyRoomCode()">

                📋 Copy Code

            </button>


            <button
                onclick="shareRoom()">

                🔗 Share

            </button>


            <button
                class="secondary"
                onclick="leaveRoom()">

                ← Leave

            </button>


        </div>

    </div>


</div>


<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();


let currentRoom = null;


// =================================
// CREATE ROOM
// =================================

function createRoom() {

    socket.emit("create-room");

}


// =================================
// ROOM CREATED
// =================================

socket.on(
    "room-created",
    function(data) {

        currentRoom =
            data.roomCode;

        showRoom(
            data.roomCode,
            data.players
        );


        document.getElementById(
            "status-message"
        ).textContent =
            "✨ Room created! Give this code to your friend.";

    }
);


// =================================
// JOIN ROOM
// =================================

function joinRoom() {

    const input =
        document.getElementById(
            "room-input"
        );


    let code =
        input.value
            .trim()
            .toUpperCase();


    if (
        !/^SB-[A-Z]{3}[0-9]{3}$/.test(code)
    ) {

        alert(
            "Please enter a valid code like SB-ABC123."
        );

        input.focus();

        return;

    }


    socket.emit(
        "join-room",
        code
    );

}


// =================================
// ROOM JOINED
// =================================

socket.on(
    "room-joined",
    function(data) {

        currentRoom =
            data.roomCode;


        showRoom(
            data.roomCode,
            data.players
        );


        document.getElementById(
            "status-message"
        ).textContent =
            "💜 Successfully joined the room!";

    }
);


// =================================
// SHOW ROOM
// =================================

function showRoom(
    roomCode,
    players
) {

    document
        .getElementById(
            "home-screen"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "room-screen"
        )
        .classList.remove(
            "hidden"
        );


    document.getElementById(
        "room-display"
    ).textContent =
        roomCode;


    updatePlayers(players);

}


// =================================
// PLAYERS UPDATED
// =================================

socket.on(
    "players-updated",
    function(data) {

        updatePlayers(
            data.players
        );


        if (data.players >= 3) {

            document.getElementById(
                "status-message"
            ).textContent =
                "🎉 All 3 players have joined!";

        }

        else if (data.players === 2) {

            document.getElementById(
                "status-message"
            ).textContent =
                "💜 Your friend joined the room!";

        }

        else {

            document.getElementById(
                "status-message"
            ).textContent =
                "⏳ Waiting for your friends...";

        }

    }
);


// =================================
// UPDATE PLAYER COUNT
// =================================

function updatePlayers(count) {

    document.getElementById(
        "players-display"
    ).textContent =
        "👥 Players: " +
        count +
        " / 3";

}


// =================================
// ROOM ERROR
// =================================

socket.on(
    "room-error",
    function(message) {

        alert(
            "❌ " + message
        );

    }
);


// =================================
// COPY ROOM CODE
// =================================

function copyRoomCode() {

    if (!currentRoom) {
        return;
    }


    navigator.clipboard
        .writeText(currentRoom)
        .then(function() {

            document.getElementById(
                "status-message"
            ).textContent =
                "📋 Room code copied! Send it to your friend.";

        });

}


// =================================
// SHARE ROOM
// =================================

function shareRoom() {

    if (!currentRoom) {
        return;
    }


    const shareUrl =
        window.location.origin +
        "/room.html?room=" +
        encodeURIComponent(
            currentRoom
        );


    if (
        navigator.share
    ) {

        navigator.share({

            title:
                "Join my Snap Bridge room",

            text:
                "Join my Snap Bridge photo booth! Code: " +
                currentRoom,

            url:
                shareUrl

        });

    }

    else {

        navigator.clipboard
            .writeText(shareUrl)
            .then(function() {

                alert(
                    "🔗 Share link copied!"
                );

            });

    }

}


// =================================
// AUTO JOIN FROM URL
// =================================

window.addEventListener(
    "load",
    function() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const room =
            params.get("room");


        if (room) {

            const input =
                document.getElementById(
                    "room-input"
                );


            input.value =
                room
                    .toUpperCase();


            setTimeout(
                function() {

                    joinRoom();

                },
                500
            );

        }

    }
);


// =================================
// ENTER KEY
// =================================

document
    .getElementById("room-input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                joinRoom();

            }

        }
    );


// =================================
// LEAVE
// =================================

function leaveRoom() {

    if (currentRoom) {
        socket.emit("leave-room", currentRoom);
    }

    window.location.href =
        "room.html";

}

</script>

</body>

</html>
