<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Snap Bridge | Choose Booth</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #e8efff,
            #f1e7ff,
            #e0f8ef
        );

    color: #263568;

}


.container {

    width: 92%;

    max-width: 1000px;

    padding: 45px;

    background:
        rgba(255,255,255,.9);

    border-radius: 30px;

    box-shadow:
        0 25px 70px
        rgba(50,60,120,.18);

    text-align: center;

}


h1 {

    font-size: 42px;

    margin-bottom: 10px;

}


h1 span {

    color: #6b6fd7;

}


.subtitle {

    color: #727c99;

    margin-bottom: 35px;

}


.cards {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 25px;

}


.card {

    background: white;

    border:
        2px solid #e1e5f2;

    border-radius: 25px;

    padding: 35px;

    box-shadow:
        0 15px 35px
        rgba(60,70,130,.08);

}


.icon {

    font-size: 55px;

}


.card h2 {

    font-size: 26px;

}


.card p {

    color: #717b96;

    line-height: 1.6;

}


button {

    width: 100%;

    border: none;

    padding: 16px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #5969d2,
            #8068d7
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    transform:
        translateY(-2px);

}


input {

    width: 100%;

    padding: 15px;

    border:
        2px solid #dce1ee;

    border-radius: 15px;

    font-size: 17px;

    text-align: center;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin: 10px 0;

}


@media(max-width:700px) {

    .cards {

        grid-template-columns: 1fr;

    }

    .container {

        padding: 25px;

    }

    h1 {

        font-size: 32px;

    }

}

</style>

</head>


<body>


<div class="container">

    <h1>
        Choose Your
        <span>Photo Booth</span>
    </h1>


    <p class="subtitle">

        Capture beautiful memories
        together with Snap Bridge.

    </p>


    <div class="cards">


        <!-- SOLO -->

        <div class="card">

            <div class="icon">
                📸
            </div>

            <h2>
                Solo Booth
            </h2>

            <p>

                Use your camera,
                filters and cute stickers
                by yourself.

            </p>

            <button
                onclick="startSolo()">

                Enter Solo Booth →

            </button>

        </div>


        <!-- SHARED -->

        <div class="card">

            <div class="icon">
                👯
            </div>

            <h2>
                Shared Booth
            </h2>

            <p>

                Create a room and invite
                your friends from another
                laptop.

            </p>

            <button
                onclick="createSharedBooth()">

                Create Shared Booth →

            </button>

        </div>


    </div>


    <br><br>


    <!-- JOIN -->

    <div class="card">

        <div class="icon">
            💜
        </div>

        <h2>
            Join Your Friend
        </h2>

        <p>
            Enter the Snap Bridge
            room code.
        </p>

        <input
            id="roomCode"
            maxlength="9"
            placeholder="SB-ABC123"
        >

        <button
            onclick="joinBooth()">

            Join Booth →

        </button>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();


// ==================================
// SOLO
// ==================================

function startSolo() {

    window.location.href =
        "booth.html?mode=solo";

}


// ==================================
// CREATE SHARED BOOTH
// ==================================

function createSharedBooth() {

    socket.emit(
        "create-room"
    );

}


// ==================================
// SERVER CREATED ROOM
// ==================================

socket.on(
    "room-created",
    function(data) {

        const room =
            data.roomCode;


        window.location.href =
            "booth.html?mode=shared&room=" +
            encodeURIComponent(room);

    }
);


// ==================================
// JOIN
// ==================================

function joinBooth() {

    let code =
        document
            .getElementById(
                "roomCode"
            )
            .value
            .trim()
            .toUpperCase();


    if (
        !/^SB-[A-Z]{3}[0-9]{3}$/
            .test(code)
    ) {

        alert(
            "Enter a valid code like SB-ABC123"
        );

        return;
    }


    window.location.href =
        "booth.html?mode=shared&room=" +
        encodeURIComponent(code);

}

</script>

</body>

</html>
