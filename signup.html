/* =====================================================

===================================================== */

/* =====================================================
   BODY
===================================================== */

/* =====================================================

/* =====================================================

===================================================== */

/* =====================================================
   BUTTERFLIES
===================================================== */

/* =====================================================
   HEARTS
===================================================== */

.heart{

    position:absolute;

.heart1{

}


.heart2{

}

/* =====================================================
   STARS
===================================================== */

.star{

    z-index:2;

.star1{

}


.star2{

}


.star3{

/* =====================================================
   LEAVES
===================================================== */

.leaf{

    position:absolute;

    z-index:2;
}


.leaf1{

    left:25px;

}


.leaf2{

    transform:rotate(25deg);
}


/* =====================================================
   PAPER PLANE
===================================================== */

.plane{

    position:absolute;

    left:60px;
    top:125px;

    color:#1e4c6b;

    font-size:42px;

    transform:rotate(-18deg);

    z-index:3;
}


/* =====================================================
   SMALL CAMERA DOODLE
===================================================== */

.camera-doodle{

    position:absolute;

    left:55px;
    bottom:125px;

    transform:rotate(-12deg);

}


/* =====================================================
   POLAROID 1
===================================================== */

.polaroid{

    position:absolute;

    background:white;

    padding:8px 8px 30px;

    box-shadow:
        0 10px 25px rgba(35,65,80,.18);

    z-index:3;
}


.polaroid img{

    width:100%;

    height:100%;

    object-fit:cover;
}


.polaroid1{

    width:130px;
    height:165px;

    right:55px;
    top:10px;

    transform:rotate(8deg);
}


/* =====================================================
   POLAROID 2
===================================================== */

.polaroid2{

    width:105px;
    height:135px;

    left:35px;
    top:330px;

    transform:rotate(-9deg);

    z-index:2;
}


.polaroid2 img{

    height:105px;
}


/* =====================================================
   POLAROID 3
===================================================== */

.polaroid3{

    width:105px;
    height:135px;

    right:50px;
    bottom:15px;

    transform:rotate(-7deg);

    z-index:2;
}


.polaroid3 img{

    height:105px;
}


/* =====================================================
   POLAROID TAPE
===================================================== */

.tape{

    position:absolute;

    width:70px;
    height:23px;

    background:rgba(89,136,128,.55);

    z-index:5;
}


.tape1{

    top:-11px;
    left:32px;

    transform:rotate(-4deg);
}


.tape2{

    top:-10px;
    left:18px;

    transform:rotate(5deg);
}


/* =====================================================
   MAIN SIGNUP PAPER
===================================================== */

.signup-card{

    position:relative;

    width:470px;

    min-height:650px;

    padding:38px 55px 32px;

    background:#fffdf8;

    border-radius:9px;

    box-shadow:

        0 20px 45px
        rgba(38,70,82,.18);

    z-index:10;

    transform:rotate(-.3deg);
}


/* =====================================================
   PAPER BORDER
===================================================== */

.signup-card:after{

    content:"";

    position:absolute;

    inset:7px;

    border:1px solid
        rgba(217,211,197,.45);

    border-radius:7px;

    pointer-events:none;
}


/* =====================================================
   TOP TAPE
===================================================== */

.top-tape{

    position:absolute;

    width:100px;
    height:30px;

    background:rgba(87,136,128,.60);

    top:-15px;

    left:50%;

    transform:
        translateX(-50%)
        rotate(3deg);

    z-index:15;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    margin-bottom:17px;

    font-family:"Pacifico",cursive;

    font-size:25px;

    color:#153b5b;

    position:relative;

    z-index:20;
}


.logo-camera{

    font-family:Arial;

    font-size:31px;
}


.logo-star{

    color:#e5a72a;

    font-family:Arial;

    font-size:20px;
}


/* =====================================================
   TITLE
===================================================== */

.title{

    text-align:center;

    font-family:"Pacifico",cursive;

    color:#173e5c;

    font-size:32px;

    line-height:1.3;

    margin-bottom:6px;

    position:relative;

    z-index:20;
}


.title-heart{

    font-family:Arial;

    font-size:27px;
}


.subtitle{

    text-align:center;

    color:#617988;

    font-size:12px;

    margin-bottom:25px;

    position:relative;

    z-index:20;
}


/* =====================================================
   FORM
===================================================== */

.form{

    position:relative;

    z-index:20;
}


/* =====================================================
   INPUT CONTAINER
===================================================== */

.input-box{

    position:relative;

    width:100%;

    margin-bottom:13px;
}


.input-box input{

    width:100%;

    height:47px;

    padding:

        0 42px 0 43px;

    border:

        1px solid #c5d0d2;

    border-radius:8px;

    background:#fff;

    outline:none;

    font-family:"DM Sans",sans-serif;

    font-size:12px;

    color:#294c63;

    transition:.25s;
}


.input-box input::placeholder{

    color:#718492;
}


.input-box input:focus{

    border-color:#4a8b8e;

    box-shadow:

        0 0 0 3px
        rgba(74,139,142,.10);
}


/* =====================================================
   INPUT ICON
===================================================== */

.input-icon{

    position:absolute;

    left:14px;

    top:13px;

    font-size:18px;

    color:#416b7f;

    z-index:2;
}


/* =====================================================
   PASSWORD EYE
===================================================== */

.eye{

    position:absolute;

    right:14px;

    top:13px;

    font-size:17px;

    color:#496d7e;

    cursor:pointer;

    z-index:3;
}


/* =====================================================
   SIGNUP BUTTON
===================================================== */

.signup-button{

    display:block;

    width:70%;

    height:48px;

    margin:

        22px auto 0;

    border:none;

    border-radius:25px;

    background:#478c8f;

    color:white;

    font-family:"DM Sans",sans-serif;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    box-shadow:

        0 7px 15px
        rgba(71,140,143,.18);

    transition:.3s;

    position:relative;

    z-index:20;
}


.signup-button:hover{

    background:#36777b;

    transform:translateY(-2px);

    box-shadow:

        0 10px 20px
        rgba(71,140,143,.25);
}


/* =====================================================
   LOGIN TEXT
===================================================== */

.login-text{

    text-align:center;

    margin-top:18px;

    font-size:11px;

    color:#667a87;

    position:relative;

    z-index:20;
}


.login-text a{

    color:#246d74;

    font-weight:700;

    text-decoration:none;

    margin-left:5px;
}


.login-text a:hover{

    text-decoration:underline;
}


/* =====================================================
   SIDE MESSAGE
===================================================== */

.message{

    position:absolute;

    right:18px;

    bottom:145px;

    width:105px;

    text-align:center;

    color:#214d66;

    font-family:"Pacifico",cursive;

    font-size:14px;

    line-height:1.45;

    transform:rotate(-8deg);

    z-index:8;
}


/* =====================================================
   FILM STRIP
===================================================== */

.film-strip{

    position:absolute;

    width:45px;

    height:155px;

    left:115px;

    bottom:35px;

    background:#294c67;

    transform:rotate(7deg);

    opacity:.75;

    z-index:1;
}


.film-strip:before,
.film-strip:after{

    content:"";

    position:absolute;

    width:8px;

    height:100%;

    background:

        repeating-linear-gradient(
            to bottom,
            #d9eee8 0 10px,
            transparent 10px 20px
        );

}


.film-strip:before{

    left:4px;
}


.film-strip:after{

    right:4px;
}


/* =====================================================
   HANDWRITTEN LABEL
===================================================== */

.label{

    position:absolute;

    color:#28536a;

    font-family:"Pacifico",cursive;

    font-size:12px;

    z-index:4;
}


.label1{

    left:35px;

    top:485px;

    transform:rotate(-8deg);
}


.label2{

    right:125px;

    top:185px;

    transform:rotate(7deg);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .signup-card{

        width:430px;

        min-height:610px;

        padding:
            35px 48px 30px;
    }

    .polaroid1{

        width:100px;
        height:130px;
    }

    .polaroid1 img{

        height:100px;
    }

    .polaroid2,
    .polaroid3,
    .message,
    .film-strip{

        opacity:.65;
    }
}


@media(max-width:650px){

    body{
        overflow:auto;
    }

    .page{

        min-height:100vh;

        height:auto;

        padding:40px 0;
    }

    .signup-card{

        width:88%;

        min-height:auto;

        padding:
            32px 25px 30px;
    }

    .logo{

        font-size:22px;
    }

    .title{

        font-size:27px;
    }

    .subtitle{

        font-size:11px;
    }

    .signup-button{

        width:78%;
    }

    .polaroid1,
    .polaroid2,
    .polaroid3{

        display:none;
    }

    .message{

        display:none;
    }

    .film-strip{

        display:none;
    }

}


@media(max-width:430px){

    .signup-card{

        width:92%;

        padding:
            28px 20px;
    }

    .title{

        font-size:24px;
    }

    .input-box input{

        height:45px;
    }

    .signup-button{

        width:82%;

        height:46px;
    }

    .flower,
    .butterfly,
    .heart,
    .star,
    .leaf{

        opacity:.55;
    }

}

</style>

</head>


<body>


<div class="page">

<script>

/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

function togglePassword(inputId, element){

    const input =
        document.getElementById(inputId);


    if(input.type === "password"){

        input.type = "text";

        element.textContent = "◎";

    }

    else{

        input.type = "password";

        element.textContent = "◉";

    }

}


/* =====================================================
   SIGNUP FORM
===================================================== */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        /* CHECK EMPTY */

        if(
            name === "" ||
            email === "" ||
            password === "" ||
            confirmPassword === ""
        ){

            alert(
                "Please fill in all fields."
            );

            return;
        }


        /* VALIDATE EMAIL */

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!emailRegex.test(email)){
            alert(
                "Please enter a valid email ID (e.g. name@example.com)."
            );
            return;
        }


        /* PASSWORD LENGTH */

        if(password.length < 6){

            alert(
                "Password must contain at least 6 characters."
            );

            return;
        }


        /* PASSWORD MATCH */

        if(password !== confirmPassword){

            alert(
                "Passwords do not match."
            );

            return;
        }


        /* SAVE ACCOUNT */

        try {
            let users = [];
            const savedUsers = localStorage.getItem("snapBridgeUsers");
            if (savedUsers) {
                users = JSON.parse(savedUsers);
            }
            const existingIndex = users.findIndex(u => u.email.toLowerCase() === email.toLowerCase());
            const newUser = { name: name, email: email, password: password };
            if (existingIndex >= 0) {
                users[existingIndex] = newUser;
            } else {
                users.push(newUser);
            }
            localStorage.setItem("snapBridgeUsers", JSON.stringify(users));
            localStorage.setItem("snapBridgeUser", JSON.stringify(newUser));
        } catch(e) {
            console.error("Storage error:", e);
        }


        /* SUCCESS */

        alert(
            "Account created successfully for " + email + "! 📸✨"
        );


        /* GO TO LOGIN */

        window.location.href =
            "index.html";

    }
);
</script>
